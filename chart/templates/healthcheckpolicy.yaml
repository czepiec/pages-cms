{{- if .Values.healthCheckPolicy.enabled -}}
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "pages-cms.fullname" . }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /actions/app/health-check
  targetRef:
    group: ""
    kind: Service
    name: {{ include "pages-cms.fullname" . }}-http
{{- end }}
